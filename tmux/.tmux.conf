set-option -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# vim-tmux-navigator: use default Ctrl+hjkl bindings
set -g @vim_navigator_disable_when_zoomed 1

bind -n S-Left previous-window
bind -n S-Right next-window
 
setw -g mouse on
 
bind-key v split-window -h
bind-key h split-window -v
bind -r m resize-pane -Z
 
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."
bind-key y copy-mode
bind-key e split-window -v -c "#{pane_current_path}" "$SHELL -i" \; resize-pane -Z
bind-key E display-popup -E -d "#{pane_current_path}" -w 90% -h 80% "$SHELL -i"

set -g command-alias[0] pname='select-pane -T'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# tmux-yank uses prefix+y to copy the current line by default; keep prefix+y for copy mode.
set -g @yank_line 'M-y'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# ── tmux-sessionx ─────────────────────────────
# Keep tmux's default prefix+s session chooser; launch sessionx with prefix+O.
bind-key s choose-tree -Zs
set -g @sessionx-bind 'O'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-filter-current 'false'

# Allow programs in the pane to bypass tmux (needed for image rendering)
set -g allow-passthrough on

# Enable extended keys for modified key sequences (e.g. Shift+Enter)
set -g extended-keys on
# extended-keys-format was added after tmux 3.4; guard it for older tmux versions.
%if "#{>=:#{version},3.5}"
set -g extended-keys-format csi-u
%endif

# ── Pane focus visibility ─────────────────────
# Dim inactive panes, highlight active pane border
set -g pane-border-style fg='#4a4a4a'
set -g pane-active-border-style fg='#7aa2f7'
set -g window-style bg='#0a0a0a'
set -g window-active-style bg='#000000'
set -g pane-border-status top

# ── Status bar ────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style bg='#1a1b26',fg='#c0caf5'

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"

# Right: date and time
set -g status-right-length 60
set -g status-right "#[fg=#565f89]%a %d %b  #[fg=#c0caf5,bold]%H:%M"

# Window list (center)
set -g status-justify left
setw -g window-status-format " #[fg=#565f89]#I #W "
setw -g window-status-current-format "#[bg=#2a2b3d,fg=#7aa2f7,bold] #I #W #[bg=#1a1b26,fg=#2a2b3d]"
setw -g window-status-separator ""

run '~/.tmux/plugins/tpm/tpm'
